[rmk]
ble_profiles_num = 5
auto_mouse_layer_max_num = 2
split_central_sleep_timeout_seconds = 300

[event.action]
pubs = 2
subs = 2

[event.central_connected]
subs = 2

[event.sleep_state]
# Three ReeL-local power-aware tasks subscribe on the central: calibration,
# profile CPI, and battery monitoring. Feature-based RMK subscribers are added
# on top of this base count during the build.
subs = 4
